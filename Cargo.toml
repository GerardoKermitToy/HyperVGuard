[workspace]
resolver = "2"
members = ["protocol", "policy", "driver"]
default-members = ["protocol", "policy"]

[workspace.dependencies]
likely_stable = { version = "0.1.3", default-features = false }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 2
debug = "full"
strip = "none"

[profile.release.build-override]
debug = "full"

[profile.dev]
panic = "abort"
debug = "full"

[profile.dev.build-override]
debug = "full"
